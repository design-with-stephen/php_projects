<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Category Page</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="../../styles/main.css" />
    <link rel="stylesheet" href="../../styles/utils.css" />
  </head>
  <body>
    <div class="main_container">
      <aside class="main_sidebar">
        <!-- sidebar content-->
        <nav class="sidebar_nav">
          <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="categories.html">Categories</a></li>
            <li><a href="records.html">Records</a></li>
            <li><a href="users.html">Users</a></li>
            <li><a href="settings.html">Settings</a></li>
          </ul>
        </nav>
      </aside>
      <section class="main_wrap">
        <header>
          <nav class="topbar">
            <div class="logo">
              <h4>Xprodata</h4>
            </div>
            <div class="profile">
              <span class="username">John Doe</span>
              <img src="../../assets/images/user.png" alt="profile image" />
            </div>
          </nav>
        </header>
        <section class="main_section">
          <div class="form_header">
            <h2 class="section_title">Add Category</h2>
            <button class="ctn">
              <a href="categories.html">View categories</a>
            </button>
          </div>
          <div class="form_wrap">
            <form action="">
              <div class="input_controls">
                <label for="CategoryName">Category Name</label>
                <input
                  type="text"
                  class="input_field"
                  name="CategoryName"
                  placeholder="eg. edibles"
                />
              </div>
              <div class="input_controls">
                <label for="description">Description</label>
                <input
                  type="text"
                  class="input_field"
                  name="description"
                  placeholder="eg. small description about the category"
                />
              </div>
              <div class="wrap">
                <button class="add_btn">Save category</button>
              </div>
            </form>
          </div>
        </section>
      </section>
    </div>
  </body>
</html>
