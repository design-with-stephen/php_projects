<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="pages_styles/loginPage.css">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/utils.css">
  </head>
  <body>
    <div class="login_container">
      <div class="form_wrap">
        <div class="form_header">
            <h2 class="section_title">Login</h2>
        </div>
        <form action="">
          
          <div class="input_controls">
            <label for="email">Email</label>
            <input
              type="email"
              class="input_field"
              name="email"
              placeholder="eg. example@gmail.com"
            />
          </div>

          <div class="input_controls">
            <label for="lastname">Password</label>
            <input
              type="text"
              class="input_field"
              name="lastName"
              placeholder="xxxxxxxx"
            />
          </div>
          <div class="forgotpaasword_wrap"><a href="forgot_password.html">Forgot Password?</a></div>
          <div class="loginBtn_wrapper">
            <button class="login_btn">Login</button>
          </div>
        </form>
        <div class="register_wrap"><a href="register.html">Don't Have an Account?<em>Register</em></a></div>
      </div>
    </div>
  </body>
</html>
