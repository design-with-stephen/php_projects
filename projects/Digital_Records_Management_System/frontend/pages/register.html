<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="pages_styles/register.css" />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/utils.css" />
  </head>
  <body>
    <div class="login_container">
      <div class="form_wrap">
        <div class="form_header">
          <h2 class="section_title">Register</h2>
          <p class="tagline_description">fill in your details</p>
        </div>
        <form action="">
          <div class="input_controls">
            <label for="firstname">First Name</label>
            <input
              type="text"
              class="input_field"
              name="firstName"
              placeholder="eg. lomoro"
            />
          </div>
          <div class="input_controls">
            <label for="lastname">Last Name</label>
            <input
              type="text"
              class="input_field"
              name="lastName"
              placeholder="eg. stephen"
            />
          </div>
          <div class="input_controls">
            <label for="email">Email</label>
            <input
              type="email"
              class="input_field"
              name="email"
              placeholder="eg. example@gmail.com"
            />
          </div>
          <div class="input_controls">
            <label for="code">Business Category</label>
            <select name="bsuiness_category" id="business_category" class="input_field">
              <option value="">Select Business Type</option>
              <option value="">Nail Tech</option>
              <option value="ssd">Saloon</option>
              <option value="ssd">Graphics Design</option>
              <option value="ssd">Photography</option>
              <option value="ssd">Retail shop</option>
              <option value="ssd">Others</option>
            </select>
          </div>
          <div class="input_controls">
            <label for="lastname">Password</label>
            <input
              type="text"
              class="input_field"
              name="lastName"
              placeholder="xxxxxxxx"
            />
          </div>
          <div class="input_controls">
            <label for="lastname">Confrim Password</label>
            <input
              type="text"
              class="input_field"
              name="lastName"
              placeholder="xxxxxxxx"
            />
          </div>

          <div class="loginBtn_wrapper">
            <button class="login_btn">Register</button>
          </div>
        </form>
        <div class="register_wrap">
          <a href="login.html">Already Have an Account?<em>Login</em></a>
        </div>
      </div>
    </div>
  </body>
</html>
